name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Android Workload
        run: dotnet workload install android

      - name: Restore
        run: dotnet restore ApeFree.Apedroid.slnx

      - name: Build
        run: dotnet build ApeFree.Apedroid.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ApeFree.Apedroid.slnx --configuration Release --no-build
